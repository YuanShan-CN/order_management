<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影订单管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; color: white; padding: 40px; }
        h1 { font-size: 48px; margin-bottom: 20px; font-weight: 300; }
        .subtitle { font-size: 18px; margin-bottom: 60px; opacity: 0.9; }
        .features { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .feature { background: rgba(255,255,255,0.15); padding: 40px; border-radius: 15px; min-width: 220px; cursor: pointer; transition: all 0.3s; }
        .feature:hover { background: rgba(255,255,255,0.25); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .feature-icon { font-size: 48px; margin-bottom: 15px; }
        .feature-title { font-size: 18px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 摄影订单管理系统</h1>
        <p class="subtitle">专业记录您的每一个摄影订单</p>
        
        <div class="features">
            <div class="feature" onclick="location.href='/orders'">
                <div class="feature-icon">📝</div>
                <div class="feature-title">订单管理</div>
            </div>
            <div class="feature" onclick="location.href='/shops'">
                <div class="feature-icon">🏪</div>
                <div class="feature-title">店铺维护</div>
            </div>
            <div class="feature" onclick="location.href='/stats'">
                <div class="feature-icon">💰</div>
                <div class="feature-title">收入统计</div>
            </div>
        </div>
    </div>
</body>
</html>
