services:
  app:
    build: .
    container_name: order_management_app
    ports:
      - "8081:8080"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    volumes:
      - ./config.yaml:/app/config.yaml
    networks:
      - app_network
    restart: unless-stopped

  db:
    image: mariadb:11.5
    container_name: my_mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - ~/code/docker/my_mariadb/mariadb_data:/var/lib/mysql
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
