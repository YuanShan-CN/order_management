services:
  app:
    build: .
    container_name: order_management_app
    ports:
      - "8081:8080"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - SERVER_PORT=${SERVER_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - ./config.yaml:/app/config.yaml
      - ~/code/docker/order_management/data:/app/data
      - ~/code/docker/order_management/logs:/app/logs
    networks:
      - app_network
    restart: unless-stopped

  db:
    image: mariadb:11.5
    container_name: my_mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - ~/code/docker/order_management/mariadb_data:/var/lib/mysql
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: order_management_redis
    ports:
      - "6379:6379"
    volumes:
      - ~/code/docker/order_management/redis_data:/data
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
